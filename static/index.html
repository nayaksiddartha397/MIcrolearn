<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Repayment Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
    .container { width: 720px; max-width: calc(100% - 32px); margin: 30px auto; background: white; border: 1px solid #ccc; padding: 20px; }
    h1 { margin-top: 0; font-size: 25px; color: #333; }
    h2 { font-size: 18px; margin: 25px 0 10px; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
    p { color: #555; line-height: 1.4; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
    label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 4px; }
    input, select { width: 100%; box-sizing: border-box; padding: 7px; border: 1px solid #aaa; border-radius: 2px; font-size: 14px; }
    button { margin-top: 24px; padding: 9px 16px; background: #286090; border: 1px solid #204d74; color: white; cursor: pointer; font-size: 14px; }
    button:hover { background: #204d74; }
    .result, .error { margin-top: 20px; padding: 14px; border: 1px solid #ccc; }
    .result.approved { background: #e7f5e8; border-color: #8acb90; }
    .result.denied { background: #fde8e8; border-color: #e39494; }
    .error { color: #8b0000; background: #fff0f0; border-color: #e39494; }
    .small { font-size: 13px; color: #666; }
    @media (max-width: 600px) { .fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Loan Repayment Predictor</h1>
    <p>This project predicts whether a loan is likely to be repaid.</p>

    <form id="loan-form">
      <h2>Loan details</h2>
      <div class="fields">
        <div><label for="loan_amnt">Loan Amount ($)</label><input id="loan_amnt" name="loan_amnt" type="number" value="15000" required></div>
        <div><label for="term">Loan Term</label><select id="term" name="term"><option>36 months</option><option>60 months</option></select></div>
        <div><label for="int_rate">Interest Rate (%)</label><input id="int_rate" name="int_rate" type="number" step="0.1" value="13.5" required></div>
        <div><label for="installment">Monthly Installment ($)</label><input id="installment" name="installment" type="number" value="455" required></div>
        <div><label for="purpose">Purpose</label><select id="purpose" name="purpose"><option value="debt_consolidation">Debt Consolidation</option><option value="credit_card">Credit Card</option><option value="home_improvement">Home Improvement</option><option value="major_purchase">Major Purchase</option><option value="small_business">Small Business</option><option value="other">Other</option></select></div>
      </div>

      <h2>Applicant details</h2>
      <div class="fields">
        <div><label for="annual_inc">Annual Income ($)</label><input id="annual_inc" name="annual_inc" type="number" value="65000" required></div>
        <div><label for="dti">Debt-to-Income Ratio (%)</label><input id="dti" name="dti" type="number" step="0.1" value="18" required></div>
        <div><label for="emp_length">Employment Length</label><select id="emp_length" name="emp_length"><option>&lt; 1 year</option><option>1 year</option><option>2 years</option><option>3 years</option><option>4 years</option><option selected>5 years</option><option>6 years</option><option>7 years</option><option>8 years</option><option>9 years</option><option>10+ years</option></select></div>
        <div><label for="home_ownership">Home Ownership</label><select id="home_ownership" name="home_ownership"><option selected>RENT</option><option>OWN</option><option>MORTGAGE</option></select></div>
        <div><label for="verification_status">Income Verification</label><select id="verification_status" name="verification_status"><option>Not Verified</option><option selected>Verified</option><option>Source Verified</option></select></div>
      </div>

      <h2>Credit history</h2>
      <div class="fields">
        <div><label for="revol_bal">Revolving Balance ($)</label><input id="revol_bal" name="revol_bal" type="number" value="8500" required></div>
        <div><label for="revol_util">Revolving Utilization (0 to 1)</label><input id="revol_util" name="revol_util" type="number" step="0.01" min="0" max="1" value="0.45" required></div>
        <div><label for="open_acc">Open Credit Lines</label><input id="open_acc" name="open_acc" type="number" value="8" required></div>
        <div><label for="total_acc">Total Credit Lines</label><input id="total_acc" name="total_acc" type="number" value="22" required></div>
        <div><label for="delinq_2yrs">Delinquencies (2 years)</label><input id="delinq_2yrs" name="delinq_2yrs" type="number" value="0" required></div>
        <div><label for="inq_last_6mths">Inquiries (6 months)</label><input id="inq_last_6mths" name="inq_last_6mths" type="number" value="1" required></div>
        <div><label for="mths_since_last_delinq">Months Since Delinquency</label><input id="mths_since_last_delinq" name="mths_since_last_delinq" type="number" value="0" required></div>
        <div><label for="pub_rec">Public Records</label><input id="pub_rec" name="pub_rec" type="number" value="0" required></div>
        <div><label for="years_since_earliest_cr_line">Years of Credit History</label><input id="years_since_earliest_cr_line" name="years_since_earliest_cr_line" type="number" value="8" required></div>
        <div><label for="years_since_last_credit_pull">Years Since Last Credit Pull</label><input id="years_since_last_credit_pull" name="years_since_last_credit_pull" type="number" value="1" required></div>
      </div>

      <button type="submit">Check Loan</button>
    </form>

    <div id="message" aria-live="polite"></div>
    <p class="small">This is a student project and should not be used for real lending decisions.</p>
  </div>

  <script>
    const form = document.getElementById('loan-form');
    const message = document.getElementById('message');
    const numberFields = ['loan_amnt', 'int_rate', 'installment', 'annual_inc', 'dti', 'revol_bal', 'revol_util', 'open_acc', 'total_acc', 'delinq_2yrs', 'inq_last_6mths', 'mths_since_last_delinq', 'pub_rec', 'years_since_earliest_cr_line', 'years_since_last_credit_pull'];

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      const values = Object.fromEntries(new FormData(form).entries());
      numberFields.forEach(function (field) { values[field] = Number(values[field]); });
      message.className = '';
      message.innerHTML = '<p>Checking loan details...</p>';
      try {
        const response = await fetch('/api/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(values) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Prediction failed.');
        const approved = result.prediction === 0;
        message.className = 'result ' + (approved ? 'approved' : 'denied');
        message.innerHTML = '<h2>Result: ' + result.verdict + '</h2><p>Default probability: <strong>' + (result.probability * 100).toFixed(2) + '%</strong></p><p>Risk level: <strong>' + result.risk_level + '</strong></p><p class="small">Important factors: ' + result.top_factors.map(function (factor) { return factor.label; }).join(', ') + '</p>';
      } catch (error) {
        message.className = 'error';
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
